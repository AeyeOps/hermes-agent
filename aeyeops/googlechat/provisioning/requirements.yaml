version: 1
platform: googlechat
owner: aeyeops

integration:
  chat_app_name: Example Chat Assistant
  project_id: example-gchatbot-project
  project_number: "PROJECT_NUMBER_PLACEHOLDER"
  service_account_email: example-chat-assistant@example-gchatbot-project.iam.gserviceaccount.com
  service_account_oauth2_client_id: "SERVICE_ACCOUNT_OAUTH_CLIENT_ID_PLACEHOLDER"
  service_account_key_default: ~/.example-chat-assistant/key.json
  chat_api_configuration_url: https://console.developers.google.com/apis/api/chat.googleapis.com/hangouts-chat?project=example-gchatbot-project
  marketplace_sdk_configuration_url: https://console.cloud.google.com/apis/api/appsmarket-component.googleapis.com/googleapps_sdk?project=example-gchatbot-project
  workspace_addons_authorization:
    observed_via: gcloud workspace-add-ons get-authorization --project example-gchatbot-project
    oauth_client_id: PROJECT_NUMBER-OAUTH_CLIENT_SUFFIX.apps.googleusercontent.com
    service_account_email: GOOGLE_MANAGED_SERVICE_AGENT_PLACEHOLDER

pubsub:
  topic: projects/example-gchatbot-project/topics/chat-events
  legacy_subscription: projects/example-gchatbot-project/subscriptions/chat-events-sub
  chat_publisher_principal: chat-api-push@system.gserviceaccount.com

spaces:
  dogfood:
    id: SPACE_RESOURCE_PLACEHOLDER
    name: example-test-space
    purpose: live verification and demo space

runtime_scopes:
  baseline:
    - scope: https://www.googleapis.com/auth/chat.bot
      status: accepted
      required_for:
        - send text replies as the Chat app
        - download inbound uploaded attachments
      source_of_truth:
        - gateway/platforms/googlechat.py:CHAT_API_SCOPES
        - aeyeops/googlechat/adr/008-authentication-bot-identity-service-account.md

capability_scopes:
  R1_workspace_events_message_created:
    status: admin_approval_required
    least_privilege_cycle: 1
    candidate_scopes:
      - https://www.googleapis.com/auth/chat.app.messages.readonly
    target_spaces:
      - SPACE_RESOURCE_PLACEHOLDER
    event_types:
      - google.workspace.chat.message.v1.created
    payload_options:
      include_resource: true
    verification:
      command: python aeyeops/googlechat/verify/r1_app_scope_probe.py
      last_observed_at: "2026-04-24T01:36:47Z"
      last_outcome: admin_approval_required
      admin_request: aeyeops/googlechat/verify/admin-approval-request-r1.md
    notes:
      - Cloud-side Marketplace SDK OAuth scopes were confirmed to include userinfo.email, userinfo.profile, and chat.app.messages.readonly.
      - userinfo.email and userinfo.profile are default Marketplace SDK scopes and are not expected to block this app-auth probe.
      - Do not approve broader app scopes for R1 until this read-only scope is proven insufficient.
      - Do not use DWD for R1 unless app-auth read-only verification fails after admin approval.
      - If the probe still returns admin_approval_required after approval, verify the Marketplace SDK App Configuration contains the scope and the admin-installed app is this project/app instance.
      - Diagnostic probe with chat.bot alone returns ACCESS_TOKEN_SCOPE_INSUFFICIENT for subscription creation.
      - Diagnostic probe with chat.bot plus chat.app.messages.readonly still returns admin_approval_required.

  R2b_outbound_native_media_upload:
    status: not_requested
    least_privilege_cycle: null
    candidate_scopes: []
    notes:
      - Probe only after R1 is resolved.
      - Current public method docs do not list chat.bot for media.upload.

  R3_lifecycle_reactions:
    status: not_requested
    least_privilege_cycle: null
    candidate_scopes: []
    notes:
      - Probe only after R1 is resolved.
      - Keep feature flag off by default even if a scope is verified.

admin_actions:
  pending:
    - capability: R1_workspace_events_message_created
      action: approve one additional Chat app scope for Example Chat Assistant
      scope: https://www.googleapis.com/auth/chat.app.messages.readonly
      verification_afterward: python aeyeops/googlechat/verify/r1_app_scope_probe.py
